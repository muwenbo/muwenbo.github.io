<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .strand { fill: none; stroke: #2c3e50; stroke-width: 1.5; stroke-linecap: round; }
      .base { stroke: #3498db; stroke-width: 1; }
