  <line class="base" x1="9" y1="9" x2="23" y2="9"/>
  <line class="base" x1="10" y1="13" x2="22" y2="13"/>
  <line class="base" x1="11" y1="17" x2="21" y2="17"/>
  <line class="base" x1="10" y1="21" x2="22" y2="21"/>
  <line class="base" x1="9" y1="25" x2="23" y2="25"/>
  <line class="base" x1="8" y1="29" x2="24" y2="29"/>
</svg>
