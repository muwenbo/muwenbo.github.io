# Site settings
title: Wenbo Mu
description: >
  Bioinformatician sharing insights on medical genetics, precision medicine, and life adventures.
url: "https://muwenbo.github.io"

# Theme settings
remote_theme: chesterhow/tale

# Build settings
markdown: kramdown
kramdown:
  # Straight quotes: kramdown's smart quotes pick open/close from spaces,
  # which Chinese text lacks, so "中文" rendered as ”中文”.
  smart_quotes: ["apos", "apos", "quot", "quot"]

# Plugins
plugins:
  - jekyll-remote-theme

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - CLAUDE.md
  - README.md
  - scripts
  - wechat-public-blogs